<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1420"/>
      <stop offset="55%" stop-color="#141b2e"/>
      <stop offset="100%" stop-color="#1f3864"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#e0b64a"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e5395"/>
      <stop offset="100%" stop-color="#1f3864"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#2e5395" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2e5395" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <rect x="0" y="0" width="1200" height="6" fill="url(#gold)"/>
  <rect x="0" y="624" width="1200" height="6" fill="url(#gold)"/>

  <!-- app mark -->
  <rect x="90" y="88" width="64" height="64" rx="16" fill="url(#logoGrad)"/>
  <text x="122" y="130" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">L4</text>

  <text x="174" y="118" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="500" fill="#a3adc6">Programme Plan</text>
  <text x="174" y="142" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#717d9c">Executive view</text>

  <text x="90" y="255" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="58" font-weight="600" fill="#eaeefb">L4 Programme Plan Viewer</text>
  <text x="90" y="304" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#a3adc6">Drop an MS Project L4 export. Get an executive-grade</text>
  <text x="90" y="336" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#a3adc6">Gantt, milestones, RAID and resource view instantly.</text>

  <!-- feature chips -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="500">
    <rect x="90" y="368" width="118" height="34" rx="17" fill="#1c2338" stroke="#2a3350"/>
    <text x="149" y="390" fill="#c6d0ea" text-anchor="middle">100% client-side</text>

    <rect x="220" y="368" width="150" height="34" rx="17" fill="#1c2338" stroke="#2a3350"/>
    <text x="295" y="390" fill="#c6d0ea" text-anchor="middle">No upload, no backend</text>

    <rect x="382" y="368" width="130" height="34" rx="17" fill="#1c2338" stroke="#2a3350"/>
    <text x="447" y="390" fill="#c6d0ea" text-anchor="middle">Works offline</text>
  </g>

  <!-- mini gantt / milestone motif -->
  <g transform="translate(90,440)">
    <rect x="0" y="0" width="1020" height="120" rx="16" fill="#161c2c" stroke="#2a3350"/>

    <rect x="28" y="24" width="230" height="10" rx="5" fill="#2e5395"/>
    <rect x="28" y="48" width="140" height="10" rx="5" fill="#b8860b"/>
    <rect x="28" y="72" width="330" height="10" rx="5" fill="#2e7d32"/>

    <circle cx="420" cy="29" r="7" fill="#e0b64a"/>
    <circle cx="600" cy="53" r="7" fill="#2e5395"/>
    <circle cx="760" cy="77" r="7" fill="#c62828"/>

    <line x1="420" y1="14" x2="420" y2="98" stroke="#2a3350" stroke-width="1"/>
    <line x1="600" y1="14" x2="600" y2="98" stroke="#2a3350" stroke-width="1"/>
    <line x1="760" y1="14" x2="760" y2="98" stroke="#2a3350" stroke-width="1"/>

    <rect x="960" y="20" width="4" height="80" fill="#e0b64a"/>
  </g>

  <text x="1110" y="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#717d9c" text-anchor="end">sahirvhora.github.io/l4-plan-viewer</text>
</svg>
